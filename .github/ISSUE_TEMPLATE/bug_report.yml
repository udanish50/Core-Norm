name: Bug report
description: Report a reproducible Core-Norm implementation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Core-Norm version
  - type: input
    id: environment
    attributes:
      label: Python / NumPy / scikit-learn versions
